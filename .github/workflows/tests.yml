name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install test tools
        working-directory: tests
        run: npm install --no-fund --no-audit
      - name: Run tests (synthetic data)
        working-directory: tests
        run: node run.mjs
